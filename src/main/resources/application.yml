server:
  # Railway 같은 프록시 뒤에서 X-Forwarded-Proto/Host 를 믿어 업로드 사진 주소를 https 로 만든다
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2048

spring:
  application:
    name: chatatda-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatatda}
    username: ${DB_USER:chatatda}
    password: ${DB_PASSWORD:chatatda}
    hikari:
      # 외부 API(TMAP·카카오)를 기다리는 요청이 몰려도 다른 요청이 연결을 받을 수 있게 넉넉히, 못 받으면 30초가 아니라 5초 안에 실패
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # 목록에서 사진 같은 지연 컬렉션을 줄마다 따로 읽지 않고 100개씩 묶어 읽는다 (N+1 방지)
        default_batch_fetch_size: 100
  jackson:
    deserialization:
      accept-float-as-int: false   # 별점 4.7 같은 소수를 4로 잘라 받지 않고 400
  task:
    scheduling:
      pool:
        size: 4   # 06시 청년안심주택 수집(몇 분)이 도는 동안에도 멀티플레이 틱·핑이 멈추지 않게
  profiles:
    include: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

jwt:
  secret: ${JWT_SECRET:}

google:
  # 구글 OAuth 웹 클라이언트 ID (공개값, 프론트 VITE_GOOGLE_CLIENT_ID 와 같은 값). 비우면 /auth/google 이 502 를 준다
  client-id: ${GOOGLE_CLIENT_ID:}

app:
  auth:
    email:
      # 메일 코드 로그인(/auth/email/*). 화면은 구글 로그인만 쓴다 → 운영에서는 false 권장 (켜 두면 코드 대입 공격 표면)
      enabled: ${EMAIL_LOGIN_ENABLED:true}
  mail:
    mode: ${MAIL_MODE:log}
  seed:
    enabled: ${SEED_ENABLED:true}
    location: classpath:fixtures/
  ingest:
    enabled: ${INGEST_ENABLED:false}
    months: 12
  bus-stops:
    location: classpath:geo/bus-stops.json
  ai-rent:
    location: classpath:fixtures/ai-rent.json   # AI 서버가 꺼져 있을 때 쓰는 매물별 AI 적정가
  upload:
    # 양도 글 사진. 배포에서 디스크가 지워지는 환경이면 외부 저장소로 바꿀 것 (Task 16)
    dir: ${UPLOAD_DIR:uploads}
    # 응답 주소 앞부분 (예 https://api.example.com). 비우면 요청 주소로 만든다
    public-base-url: ${UPLOAD_PUBLIC_BASE_URL:}
  housing-ingest:
    enabled: ${HOUSING_INGEST_ENABLED:false}
    districts: 성동구,동대문구
    notice-months: 12
    request-interval-ms: 1000
    labels-location: classpath:fixtures/floorplan-labels.json

external:
  molit:
    base-url: https://apis.data.go.kr/1613000
    key: ${MOLIT_KEY:}
  tmap:
    base-url: https://apis.openapi.sk.com
    key: ${TMAP_KEY:}
  soco:
    base-url: https://soco.seoul.go.kr
  kakao:
    base-url: https://dapi.kakao.com
    rest-key: ${KAKAO_REST_KEY:}
  ai:
    enabled: ${AI_ENABLED:false}   # 평면도 AI 서버 호출 여부. 기본 꺼짐 -> fixtures 만 사용
    base-url: ${AI_SERVER_URL:}    # ai-server/ 주소

pricing:
  conversion-rate: 0.046
  grade-fair: 0.10
  grade-slight: 0.25
  grade-high: 0.50
  min-sample: 10
  area-tolerance: 0.30
  period-months: 12
  default-contract-months: 24
  baseline-mgmt-fee: 71000

world:
  # 공유 월드 1개 (인메모리, 서버 1대 전제). 넘치면 WORLD_FULL
  max-players: 30
  tick-ms: 100
  idle-timeout: 60s
  invite-ttl: 24h

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
