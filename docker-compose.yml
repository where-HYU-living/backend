# 한 번에 DB + 서버: `docker compose up --build` (Docker Desktop 에서는 backend ▶ 버튼)
# 서버 주소 http://localhost:8080  ·  Swagger http://localhost:8080/swagger-ui.html
# 8080 이 이미 쓰이고 있으면 다른 포트로: API_PORT=8081 docker compose up --build
services:
  db:
    image: postgres:16
    container_name: chatatda-db
    environment:
      POSTGRES_DB: chatatda
      POSTGRES_USER: chatatda
      POSTGRES_PASSWORD: chatatda
    ports:
      - "5432:5432"
    volumes:
      - chatatda-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatatda -d chatatda"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: chatatda-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/chatatda
      DB_USER: chatatda
      DB_PASSWORD: chatatda
      # 비밀값은 저장소에 두지 않는다: 이 폴더의 .env (git 무시됨)에 JWT_SECRET=... 를 넣는다. 예시는 .env.example
      JWT_SECRET: ${JWT_SECRET:?backend/.env 에 JWT_SECRET 을 넣어 주세요 (.env.example 참고, 32자 이상)}
      MAIL_MODE: ${MAIL_MODE:-log}
      SEED_ENABLED: "true"
      INGEST_ENABLED: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-574974997728-79vkqgmakk1f2frije5lp6teeie2b5qe.apps.googleusercontent.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://where-hyu-living.xyz,https://where-hyu-living.vercel.app}

volumes:
  chatatda-db-data:
